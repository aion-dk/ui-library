version: 2.1
orbs:
  node: circleci/node@7.2.1
  docker: assemblyvoting/docker@1.6.4
executors:
  playwright:
    docker:
      - image: mcr.microsoft.com/playwright:v1.65.1-noble
  node26:
    docker:
      - image: cimg/node:26.13
  ruby-node:
    docker:
      - image: cimg/ruby:4.0-node

jobs:
  playwright:
    executor:
      name: playwright
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "yarn.lock" }}
            - v1-dependencies-
      - node/install-yarn
      - run: yarn install --immutable
      - save_cache:
          paths:
            - ./node_modules
          key: v1-dependencies-{{ checksum "yarn.lock" }}
      - run: yarn test-storybook
  lint_test_build:
    executor:
      name: node26
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "yarn.lock" }}
            - v1-dependencies-
      - node/install-yarn
      - run: yarn install --immutable
      - save_cache:
          paths:
            - ./node_modules
          key: v1-dependencies-{{ checksum "yarn.lock" }}
      - run: yarn run lint
      - run: yarn run test-coverage
      # The unit project's root is the repo root, so vitest writes the report to ./coverage.
      - store_artifacts:
          path: coverage
          destination: coverage
      - run: yarn run build
      - run: yarn run build-storybook
  publish:
    executor:
      name: node26
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "yarn.lock" }}
            - v1-dependencies-
      - node/install-yarn
      - run: yarn install --immutable
      - run:
          # Trusted publishing (OIDC): npm exchanges this short-lived CircleCI
          # token for publish rights; no NPM_TOKEN involved. The job must keep
          # the npm-publishing context — the npm trusted-publisher config is
          # pinned to its context ID. Needs npm >= 11.5.1 (Node 24.14 ships 11.9).
          name: Publish to NPM (trusted publishing)
          command: |
            echo "npm $(npm --version)"
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            package_version=$(jq -r '.version' package.json)
            prerelease=$(echo "${package_version}" | grep -E -o "\-([^-]+)$" | sed 's/^-//')
            if [ -n "${prerelease}" ]; then
              echo "Publishing prerelease with tag ${prerelease} to NPM"
              npm publish --tag ${prerelease}
            else
              echo "Publishing release to NPM"
              npm publish
            fi
workflows:
  build_and_deploy:
    jobs:
      - lint_test_build:
          filters:
            branches:
              only: /.*/
            tags:
              only: /^v.*/
      - docker/license-checker:
          context:
            - "GIT"
          filters:
            branches:
              only: /.*/
            tags:
              only: /^v.*/
          prep-yarn: true
          prep-bundle: false
          executor: ruby-node
      - playwright:
          filters:
            branches:
              only: /.*/
            tags:
              only: /^v.*/
      - publish:
          context: ["npm-publishing"]
          requires:
            - lint_test_build
            - docker/license-checker
            - playwright
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
